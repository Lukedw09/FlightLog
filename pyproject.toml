[project]
name = "flightlog"
version = "0.1.0"
description = "Educational simulated flight-data logger for synthetic barometric telemetry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
flightlog = "flightlog.cli:cli_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flightlog*"]

[tool.setuptools.package-data]
flightlog = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
